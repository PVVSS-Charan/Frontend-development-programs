<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Profile</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    .profile-container {
      width: 600px;
      margin: 50px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }

    .profile-container h1 {
      font-family: 'Pacifico', cursive;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .profile-container p {
      font-size: 16px;
      color: #555;
      margin: 5px 0;
    }

    .social-links {
      margin-top: 20px;
    }

    .social-links a {
      text-decoration: none;
      margin: 0 10px;
      font-size: 24px;
      color: #2c3e50;
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: #3498db;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid #3498db;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <img src="student.jpg" alt="Student Photo" class="profile-pic">
    <h1>Charan</h1>
    <p>B.Tech CSE Student at GGU</p>
    <p>Interested in Cyber Security</p>

    <div class="social-links">
      <a href="https://facebook.com/username" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://twitter.com/username" target="_blank"><i class="fab fa-twitter"></i></a>
      <a href="https://linkedin.com/in/username" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://github.com/username" target="_blank"><i class="fab fa-github"></i></a>
    </div>
  </div>
</body>
</html>
